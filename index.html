<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Upgrader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <div id="toast" role="status" popover="manual"></div>

 <header id="top">
  <div class="tav" id="tAv">?</div>
  <div class="tname" id="tName">Игрок</div>
  <div class="tbal"><button type="button" class="tb-plus" id="tpOpen" aria-label="Пополнить баланс"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg></button><span id="tBal">…</span></div>
 </header>

 <section class="page hidden" id="p-cases">
  <div class="cs-tabs" id="csTabs" role="group" aria-label="Тип кейсов">
   <button type="button" data-k="paid" aria-pressed="true">Платные</button>
   <button type="button" data-k="free" aria-pressed="false">Бесплатные</button>
  </div>
  <div class="cs-grid" id="cases"><div class="empty">Загрузка…</div></div>
 </section>

 <!-- ==================== АПГРЕЙДЕР ==================== -->
 <main id="upgraderPage" class="page upgrader-page on">
    <section class="wheel-card upg-card">
        <div class="wxs-upg-switch">
            <button type="button" id="wxsGiftInventory" class="wxs-inv-btn" aria-haspopup="dialog">Инвентарь <b id="wxsGiftCount">—</b></button>
        </div>
        <div class="upg-wheel-frame">
            <div class="upg-stage-heading"><span class="upg-live-dot" aria-hidden="true"></span><span id="upgStateLabel">ГОТОВ К АПГРЕЙДУ</span></div>
            <canvas id="upgCanvas" class="upg-canvas" aria-label="Колесо апгрейдера"></canvas>
        </div>
        <div class="upg-slider-card">
            <div class="upg-slider-heading"><label for="upgChanceSlider">Шанс победы</label><output id="upgChanceValue" for="upgChanceSlider">40%</output></div>
            <div class="upg-slider-control" style="--upg-progress:43.82%;--upg-p:.4382">
                <div class="upg-slider-visual" aria-hidden="true"><div class="upg-glass-rail"><i></i></div><div class="upg-liquid-thumb"></div></div>
                <input id="upgChanceSlider" class="upg-slider" type="range" min="1" max="90" step="0.01" value="40" aria-label="Шанс победы" aria-valuetext="40%" oninput="upgSliderInput(this.value)" onchange="upgSliderEnd()" onpointerup="upgSliderEnd()" onpointercancel="upgSliderEnd()" onkeydown="upgSliderKey(event)">
            </div>
        </div>

        <div class="upg-panel">
            <div id="wxsStakeBox" class="wxs-stake-box"></div>
            <input type="number" id="upgBetInput" hidden>
            <input type="number" id="upgChanceInput" value="40" hidden>
            <button type="button" class="mines-main-btn" id="upgPlayBtn" onclick="playUpgrader()">ИГРАТЬ</button>
        </div>
    </section>
 </main>

 <section class="page hidden" id="p-prof">
  <div class="card prof">
   <div class="av" id="av">?</div>
   <div class="pinfo">
    <b id="un">Игрок</b>
    <div class="muted" id="uh"></div>
   </div>
  </div>
  <div class="card stats">
   <div><small>Оборот</small><b id="stTurn">0.00 $</b></div>
   <div><small>Ставок</small><b id="stBets">0</b></div>
   <div><small>Макс. коэф.</small><b id="stMax">x0.00</b></div>
  </div>
  <button class="btn" id="openInv" type="button">Инвентарь <span id="giftCount">—</span></button>
 </section>

 <dialog id="reward" class="wxs-sheet rwd" aria-labelledby="rwTitle">
  <div class="wxs-sheet-grip" aria-hidden="true"></div>
  <div class="cv-top"><span class="cv-pill" id="rwTitle">Поздравляем!</span></div>
  <div class="rwd-list" id="rwList"></div>
  <button class="cv-go" id="rwSell" type="button" hidden>Продать всё</button>
  <button class="cv-go" id="rwUp" type="button" hidden>Апгрейднуть</button>
  <button class="cv-go ghost" id="rwClose" type="button">Ок</button>
  <button class="cv-go ghost" id="rwInv" type="button">В инвентарь</button>
 </dialog>

    <dialog id="wxsGiftDialog" class="wxs-sheet" aria-labelledby="wxsGiftTitle">
        <div class="wxs-sheet-grip" aria-hidden="true"></div>
        <header>
            <button type="button" id="wxsGiftBack" class="wxs-sheet-back" aria-label="Назад" hidden>‹</button>
            <div class="wxs-sheet-title"><h2 id="wxsGiftTitle"></h2><p id="wxsGiftSub" role="status"></p></div>
            <button type="button" id="wxsGiftClose" aria-label="Закрыть">×</button>
        </header>
        <button type="button" id="wxsGiftRetry" hidden>Обновить инвентарь</button>
        <input type="search" id="wxsGiftSearch" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off">
        <div id="wxsGiftItem" class="wxs-item" hidden></div>
        <div id="wxsGiftList" class="wxs-gift-grid"></div>
        <div id="wxsGiftEmpty" class="wxs-gift-empty" hidden></div>
    </dialog>

    <div id="tpSheet" class="tp" hidden>
        <div class="tp-back"></div>
        <div class="tp-panel" id="tpPanel" role="dialog" aria-modal="true" aria-label="Пополнение">
            <div class="tp-head"><div class="stk-grip" aria-hidden="true"></div></div>
            <div class="tp-scroll">
                <h3 class="tp-h">Выберите способ оплаты</h3>
                <div class="tp-methods" id="tpMethods" role="group" aria-label="Способ оплаты"></div>
                <h3 class="tp-h">Введите сумму пополнения</h3>
                <div class="tp-amts" id="tpAmts"></div>
                <label class="tp-input"><span class="tp-cur" id="tpInCur"></span><input id="tpInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Своя сумма" aria-label="Сумма пополнения"></label>
                <p class="tp-support">Пополнение не пришло?<br><b id="tpSupport">Напишите в поддержку</b></p>
                <div class="tp-conv"><div class="tp-pill" id="tpFrom"></div><i>=</i><div class="tp-pill" id="tpTo"></div></div>
            </div>
            <button type="button" class="mines-main-btn tp-ok" id="tpPay">ПОПОЛНИТЬ</button>
        </div>
    </div>
    <div id="stkSheet" class="stk" hidden>
        <div class="stk-back"></div>
        <div class="stk-panel" id="stkPanel" role="dialog" aria-modal="true" aria-label="Твоя ставка">
            <div class="stk-head"><div class="stk-grip" aria-hidden="true"></div></div>
            <div class="stk-tabs" role="group" aria-label="Источник ставки">
                <button type="button" data-stk-tab="cash" aria-pressed="true">Баланс</button>
                <button type="button" data-stk-tab="gift" aria-pressed="false">Подарки</button>
            </div>
            <div class="stk-body">
                <div id="stkCash" class="stk-cash">
                    <label class="stk-input"><input id="stkAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Сумма ставки"><span>$</span></label>
                    <p id="stkHint" class="stk-hint" role="status"></p>
                </div>
                <div id="stkGifts" class="stk-gifts" hidden>
                    <div id="stkGiftList" class="wxs-gift-grid stk-grid"></div>
                    <div id="stkGiftEmpty" class="stk-empty" hidden></div>
                </div>
            </div>
            <button type="button" class="mines-main-btn stk-ok" id="stkOk">ОК</button>
        </div>
    </div>

 <dialog id="caseView" class="wxs-sheet cv" aria-labelledby="cvTitle">
  <div class="wxs-sheet-grip" aria-hidden="true"></div>
  <div class="cv-top">
   <span class="cv-pill" id="cvTitle"></span>
  </div>
  <div class="cv-scroll" id="cvScroll">
  <div id="cvReels" class="cv-reels" style="--n:1"></div>
  <div id="cvQty" class="cv-qty" role="group" aria-label="Сколько кейсов открыть" style="--k:0">
   <i class="cv-qthumb" aria-hidden="true"></i>
   <button type="button" data-n="1" aria-pressed="true">1</button><button type="button" data-n="2" aria-pressed="false">2</button><button type="button" data-n="3" aria-pressed="false">3</button>
  </div>
   <h3 class="cv-h">Содержимое кейса</h3>
   <div id="cvGrid" class="cv-grid"></div>
   <p id="cvEmpty" class="cv-empty" hidden>Состав кейса пока недоступен.</p>
  </div>
  <div class="cv-bar"><button type="button" id="cvGo" class="cv-go"></button></div>
  <button type="button" id="cvClose" class="cv-x" aria-label="Закрыть" tabindex="-1">×</button>
 </dialog>
 <div id="confetti" popover="manual" aria-hidden="true"><canvas id="confettiCv"></canvas></div>

 <nav id="nav">
  <div id="pill"></div>
  <div class="tabs">
   <div class="tab" data-t="cases"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9" stroke="#2a2a2e"/></svg>Кейсы</div>
   <div class="tab on" data-t="up"><svg viewBox="0 0 24 24"><path d="M5 12l7-7 7 7M5 20l7-7 7 7"/></svg>Апгрейдер</div>
   <div class="tab" data-t="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7z"/></svg>Профиль</div>
  </div>
 </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<script src="script.js"></script>
</body>
</html>
