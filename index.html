<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Upgrader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <div id="toast"></div>

 <section class="page" id="p-cases">
  <h2>КЕЙСЫ</h2>
  <div class="grid" id="cases"></div>
 </section>

 <section class="page on" id="p-up">
  <div class="card" style="padding:10px">
   <div class="gauge">
    <svg viewBox="0 0 400 400">
     <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4a1c"/><stop offset=".55" stop-color="#ffa51a"/><stop offset="1" stop-color="#ffd21a"/></linearGradient>
     <filter id="bl"><feGaussianBlur stdDeviation="5"/></filter></defs>
     <g id="ticks" stroke="#8a8a90" stroke-linecap="round"></g>
     <circle cx="200" cy="200" r="150" fill="#222226" stroke="#2c2c30"/>
     <circle cx="200" cy="200" r="101" fill="#18181b" stroke="#2c2c30"/>
     <path id="glow" fill="#ff9a1a" opacity=".5" filter="url(#bl)"/>
     <path id="arc" fill="url(#g)"/><path id="rim" fill="none" stroke="#ff9a1a" stroke-width="2.5" stroke-linecap="round"/>
     <g id="ptr"><path d="M200 66 L186 22 L200 36 L214 22Z" fill="#ffc61a" transform="translate(0,-4)"/><path d="M200 66 L200 22 L214 22Z" fill="#ffe27a" transform="translate(0,-4)"/></g>
    </svg>
    <div class="gc"><svg width="52" height="44" viewBox="0 0 52 44"><path d="M0 22L26 0 52 22V34L26 12 0 34Z" fill="#ffd21a"/><path d="M10 40L26 28 42 40" fill="none" stroke="#7a5f10" stroke-width="10"/></svg>
     <div class="pct" id="pct">40%</div><div class="x" id="mx">x2.38</div><div class="lb">ШАНС ПОБЕДЫ</div></div>
   </div>
  </div>
  <div class="card">
   <h2>СУММА СТАВКИ</h2>
   <div class="bet">
    <div class="slot"><small>ТВОЙ ПОДАРОК</small><div class="em" id="oe"></div><b id="on"></b><i id="op"></i></div>
    <div class="arrow">→</div>
    <div class="slot"><small>АПГРЕЙД ДО</small><div class="em" id="te"></div><b id="tn"></b><i id="tp"></i></div>
   </div>
   <h2 style="margin-top:16px">ТВОИ ПОДАРКИ</h2><div class="chips" id="own"></div>
   <h2>ЦЕЛЬ</h2><div class="chips" id="tgt"></div>
   <button class="btn" id="go">АПГРЕЙД</button>
  </div>
 </section>

 <section class="page" id="p-prof">
  <div class="card prof"><div class="av" id="av">U</div><div><b id="un" style="font-size:18px">Игрок</b><div style="color:var(--mu);font-size:13px">Баланс: <b id="bal" style="color:var(--gold)"></b></div></div></div>
  <button class="btn" id="topup" style="margin:0 0 14px">Пополнить +25 $</button>
  <div class="card"><h2>ИНВЕНТАРЬ (нажми — продать)</h2><div class="inv" id="inv"></div></div>
 </section>

 <nav id="nav">
  <div id="pill"></div>
  <div class="tabs">
   <div class="tab" data-t="cases"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9" stroke="#2a2a2e"/></svg>Кейсы</div>
   <div class="tab on" data-t="up"><svg viewBox="0 0 24 24"><path d="M5 12l7-7 7 7M5 20l7-7 7 7"/></svg>Апгрейдер</div>
   <div class="tab" data-t="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7z"/></svg>Профиль</div>
  </div>
  <div id="lens"><div id="dot"></div></div>
 </nav>
</div>

<script src="script.js"></script>
</body>
</html>
<!-- Refresh GitHub Pages -->
